<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个 GitHub 项目</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .card {
            text-align: center;
            padding: 48px 56px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 28px;
            color: #1a1a1a;
        }
        p {
            margin: 8px 0;
            font-size: 16px;
            color: #666;
        }
        .tag {
            display: inline-block;
            margin-top: 20px;
            padding: 6px 18px;
            background: #e6f1fb;
            color: #185fa5;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>我的第一个 GitHub 项目</h1>
        <p>这是通过 Git 命令提交上来的网页。</p>
        <p>从今天起，我会用 GitHub 管理我的代码。</p>
        <span class="tag">用户名：23116566</span>
    </div>
</body>
</html>
